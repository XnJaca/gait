<rect x="270" y="90" width="4" height="56" rx="2" fill="#A3A3A3"/>
<text x="286" y="114.5" font-size="16" font-weight="700" fill="#0A0A0A">triage</text>
<text x="286" y="135.5" font-size="13" fill="#525252">tipo y tamaño</text>
<path d="M456,118 H492" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
