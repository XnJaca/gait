<text x="758" y="114.5" font-size="16" font-weight="700" fill="#0A0A0A">planner</text>
<text x="758" y="135.5" font-size="13" fill="#525252">escribe .work/&lt;slug&gt;.md</text>
<path d="M928,118 H964" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
