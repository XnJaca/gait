<text x="986" y="135.5" font-size="13" fill="#525252">Aprobar · Ajustar</text>
<path d="M1072,160 V200 H122 V232" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
<text x="600" y="194" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">plan aprobado</text>
<rect x="24" y="236" width="196" height="64" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<rect x="34" y="250" width="4" height="36" rx="2" fill="#0A0A0A"/>
