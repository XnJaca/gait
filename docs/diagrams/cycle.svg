<text x="50" y="365.5" font-size="13" fill="#525252">tests, en paralelo</text>
<rect x="300" y="276" width="180" height="64" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<rect x="310" y="290" width="4" height="36" rx="2" fill="#A3A3A3"/>
<text x="326" y="304.5" font-size="16" font-weight="700" fill="#0A0A0A">verifier</text>
<text x="326" y="325.5" font-size="13" fill="#525252">devuelve solo fallos</text>
<rect x="540" y="276" width="180" height="64" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<rect x="550" y="290" width="4" height="36" rx="2" fill="#0A0A0A"/>
<text x="566" y="304.5" font-size="16" font-weight="700" fill="#0A0A0A">reviewer</text>
<text x="566" y="325.5" font-size="13" fill="#525252">diff contra el plan</text>
<rect x="780" y="276" width="180" height="64" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<rect x="790" y="290" width="4" height="36" rx="2" fill="#0A0A0A"/>
<text x="806" y="304.5" font-size="16" font-weight="700" fill="#0A0A0A">deliver</text>
<text x="806" y="325.5" font-size="13" fill="#525252">docs, diagramas, PR</text>
<rect x="1020" y="276" width="156" height="64" rx="10" fill="#FFE4DE" stroke="#FF3B1F" stroke-width="2"/>
<text x="1038" y="304.5" font-size="16" font-weight="700" fill="#5C1206">Mergeas</text>
<text x="1038" y="325.5" font-size="13" fill="#525252">siempre tú</text>
<path d="M220,268 L296,298" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
<path d="M220,348 L296,318" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
<path d="M480,308 H536" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
<path d="M720,308 H776" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
<path d="M960,308 H1016" fill="none" stroke="#FF3B1F" stroke-width="2" marker-end="url(#b)"/>
<text x="988" y="300" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">PR</text>
<path d="M390,276 C390,238 300,236 224,250" fill="none" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="410" y="248" font-size="12" font-weight="400" fill="#525252" text-anchor="start">falla: vuelve al builder, máx. 3</text>
<text x="24" y="418" font-size="13" font-weight="400" fill="#0A0A0A" text-anchor="start">Te interrumpe solo si el verifier falla 3 veces, si el scout encuentra un choque con una regla del proyecto o si un cambio chico resulta grande.</text>
<rect x="24" y="440" width="4" height="16" rx="2" fill="#A3A3A3"/>
<text x="36" y="453" font-size="12" font-weight="400" fill="#525252" text-anchor="start">modelo barato (Haiku)</text>
<rect x="195" y="440" width="4" height="16" rx="2" fill="#0A0A0A"/>
<text x="207" y="453" font-size="12" font-weight="400" fill="#525252" text-anchor="start">medio (Sonnet)</text>
<rect x="317" y="440" width="4" height="16" rx="2" fill="#FF3B1F"/>
<text x="329" y="453" font-size="12" font-weight="400" fill="#525252" text-anchor="start">fuerte (Opus)</text>
<rect x="432" y="440" width="16" height="16" rx="4" fill="#FFE4DE" stroke="#FF3B1F"/>
<text x="456" y="453" font-size="12" font-weight="400" fill="#525252" text-anchor="start">decisión tuya</text>
