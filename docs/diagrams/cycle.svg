<text x="42" y="105.0" font-size="16" font-weight="700" fill="#0A0A0A">Idea o ticket</text>
<text x="42" y="126.0" font-size="13" fill="#525252">lo describes o viene</text>
<text x="42" y="144.0" font-size="13" fill="#525252">del tracker</text>
