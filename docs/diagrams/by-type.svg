<text x="840" y="289" font-size="13" font-weight="400" fill="#0A0A0A" text-anchor="start">Uno por regla, con su caso de falla</text>
<line x1="24" y1="318" x2="1176" y2="318" stroke="#E5E5E5"/>
<text x="24" y="352" font-size="13" font-weight="400" fill="#525252" text-anchor="start">La suite completa corre en el CI del PR, no en la sesión. Un cambio chico lleva un plan de pocas líneas; uno grande, el plan completo.</text>
