<circle cx="498" cy="145" r="8" fill="#0A0A0A"/>
<text x="564" y="149" font-size="12" font-weight="600" fill="#FF3B1F" text-anchor="middle">se salta</text>
<circle cx="630" cy="145" r="8" fill="#0A0A0A"/>
<text x="696" y="149" font-size="12" font-weight="600" fill="#FF3B1F" text-anchor="middle">se salta</text>
