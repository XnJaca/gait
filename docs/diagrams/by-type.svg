<text x="696" y="96" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="middle">reviewer</text>
<text x="762" y="96" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="middle">deliver</text>
