<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Qué queda en cada repo">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#525252"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF3B1F"/></marker>
</defs>
<rect width="1200" height="410" fill="#FFFFFF"/>
<text x="24" y="42" font-size="20" font-weight="700" fill="#0A0A0A">Qué queda en cada repo</text>
<text x="24" y="84" font-size="13" font-weight="600" fill="#525252" text-anchor="start">Siempre cargado</text>
<text x="424" y="84" font-size="13" font-weight="600" fill="#525252" text-anchor="start">Solo si el cambio toca el área</text>
<text x="824" y="84" font-size="13" font-weight="600" fill="#525252" text-anchor="start">Solo mientras dura el cambio</text>
<rect x="24" y="98" width="352" height="92" rx="10" fill="#FAFAFA" stroke="#FF3B1F" stroke-width="2"/>
<text x="42" y="131.0" font-size="16" font-weight="700" fill="#0A0A0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AGENTS.md</text>
<text x="42" y="152.0" font-size="13" fill="#525252">qué es, stack, comandos y reglas</text>
<text x="42" y="170.0" font-size="13" fill="#525252">menos de 100 líneas</text>
<rect x="24" y="210" width="352" height="92" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<text x="42" y="243.0" font-size="16" font-weight="700" fill="#0A0A0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/README.md · docs/diagrams/</text>
<text x="42" y="264.0" font-size="13" fill="#525252">para personas: Obsidian o GitHub</text>
<text x="42" y="282.0" font-size="13" fill="#525252">SVG que mantienen los agentes</text>
<rect x="424" y="98" width="352" height="92" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<text x="442" y="131.0" font-size="16" font-weight="700" fill="#0A0A0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/context/&lt;área&gt;.md</text>
<text x="442" y="152.0" font-size="13" fill="#525252">reglas que el código no dice</text>
<text x="442" y="170.0" font-size="13" fill="#525252">menos de 60 líneas, se sobrescribe</text>
<rect x="424" y="210" width="352" height="92" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<text x="442" y="243.0" font-size="16" font-weight="700" fill="#0A0A0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">design-tokens.json</text>
<text x="442" y="264.0" font-size="13" fill="#525252">la verdad visual</text>
<text x="442" y="282.0" font-size="13" fill="#525252">solo en cambios visuales</text>
<rect x="824" y="98" width="352" height="92" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<text x="842" y="131.0" font-size="16" font-weight="700" fill="#0A0A0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.work/&lt;slug&gt;.md</text>
<text x="842" y="152.0" font-size="13" fill="#525252">el plan que apruebas</text>
<text x="842" y="170.0" font-size="13" fill="#525252">se borra al abrir el PR</text>
<rect x="824" y="210" width="352" height="92" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
<text x="842" y="243.0" font-size="16" font-weight="700" fill="#0A0A0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.gait.toml</text>
<text x="842" y="264.0" font-size="13" fill="#525252">tracker: GitHub, Jira o ninguno</text>
<text x="842" y="282.0" font-size="13" fill="#525252">sin correos ni menciones</text>
<path d="M824,144 H780" fill="none" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="802" y="136" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">deliver</text>
<rect x="24" y="330" width="1152" height="56" rx="10" fill="#0A0A0A"/>
<text x="48" y="364" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">La verdad es lo implementado: código y tests. git guarda la historia; los docs describen solo el presente.</text>
</svg>
