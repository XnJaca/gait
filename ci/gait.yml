name: gait

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # Gait is private: GAIT_TOKEN is a read-only token for its repo.
      - name: Install Gait
        run: uv tool install "git+https://x-access-token:${{ secrets.GAIT_TOKEN }}@github.com/XnJaca/gait"
      - name: Context budgets and paths
        run: gait check
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: |
          status=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            sh .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status
