[project]
name = "gait-flow"
version = "0.2.4"
description = "AI agent workflow for any project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gait = "gait.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gait"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"roles" = "gait/roles"
"rules" = "gait/rules"
"templates" = "gait/templates"
"hooks" = "gait/hooks"
"ci" = "gait/ci"
