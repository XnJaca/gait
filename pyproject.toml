[project]
name = "gait-flow"
version = "0.2.0"
description = "AI agent workflow for any project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gait = "gait.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gait"]

[tool.pytest.ini_options]
testpaths = ["tests"]
